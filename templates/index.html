<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель администратора</title>
    <!-- Подключаем Bootstrap для красоты через CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="mb-4">🤖 Планировщик - Админка</h1>

    <div class="row">
        <!-- Карточка Пользователи -->
        <div class="col-md-4">
            <div class="card text-bg-primary mb-3">
                <div class="card-header">Пользователи</div>
                <div class="card-body">
                    <h1 class="card-title">{{ total_users }}</h1>
                    <p class="card-text">Всего зарегистрировано</p>
                </div>
            </div>
        </div>

        <!-- Карточка Всего задач -->
        <div class="col-md-4">
            <div class="card text-bg-success mb-3">
                <div class="card-header">Задачи</div>
                <div class="card-body">
                    <h1 class="card-title">{{ total_tasks }}</h1>
                    <p class="card-text">Создано всего</p>
                </div>
            </div>
        </div>

        <!-- Карточка Выполнено -->
        <div class="col-md-4">
            <div class="card text-bg-warning mb-3">
                <div class="card-header">Успех</div>
                <div class="card-body">
                    <h1 class="card-title">{{ completed_tasks }}</h1>
                    <p class="card-text">Задач выполнено</p>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
